name: Build TemuTempat Malang APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TemuTempatMalang_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q TemuTempatMalang_Android_Project.zip -d source
          echo "Project files:"
          find source -maxdepth 3 -type f | head -60

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: source/TemuTempatMalang_Android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TemuTempat-Malang-debug-APK
          path: source/TemuTempatMalang_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
